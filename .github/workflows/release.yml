name: Release

# Flow: create a draft release → build Windows and macOS in parallel and upload
# their installers → assemble latest.json from the uploaded signatures and publish.
# Building latest.json once at the end avoids the two platform jobs overwriting it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要建置並發布的 tag（例如 v0.1.0）"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Create (or reuse) draft release
        id: release
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = process.env.TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) return String(existing.id);
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `StockApp ${tag}`,
              draft: true,
              body: [
                "## 下載",
                "",
                "| 檔案 | 說明 |",
                "|---|---|",
                "| `StockApp_*_x64-setup.exe` | Windows（推薦），裝在使用者目錄，不需要管理員權限 |",
                "| `StockApp_*_x64.msi` | Windows IT 部署用，裝在 Program Files，需要管理員權限 |",
                "| `StockApp_*_universal.dmg` | macOS 11 以上（Apple Silicon 與 Intel 皆可） |",
                "",
                "**Windows**：安裝檔沒有數位簽章，出現 SmartScreen 警告時請點「其他資訊 → 仍要執行」。",
                "",
                "**macOS**：App 沒有經過 Apple 公證，第一次安裝後請在終端機執行一次：",
                "```",
                "xattr -dr com.apple.quarantine /Applications/StockApp.app",
                "```",
                "",
                "已安裝 v0.1.2 以上的版本會自動提示更新。",
              ].join("\n"),
            });
            return String(data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # WiX (MSI) needs VBScript, which newer Windows images may ship without.
      - name: Ensure VBScript is installed
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: DISM /Online /Add-Capability /CapabilityName:VBSCRIPT~~~~ /NoRestart

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          # GitHub strips non-ASCII characters from asset names, so use an ASCII prefix.
          assetNamePattern: StockApp_[version]_[arch][setup][ext]
          # latest.json is assembled once by the publish job below.
          includeUpdaterJson: false

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Write latest.json and publish the release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const version = process.env.TAG.replace(/^v/, "");
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo,
              release_id,
              per_page: 100,
            });
            const byName = new Map(assets.map((a) => [a.name, a]));

            async function entry(name) {
              const sig = byName.get(`${name}.sig`);
              if (!sig) return null;
              const res = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                ...context.repo,
                asset_id: sig.id,
                headers: { accept: "application/octet-stream" },
              });
              // Not `browser_download_url`: while the release is still a draft that points at a
              // temporary `untagged-…` path, which 404s once the release is published.
              const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${process.env.TAG}/${encodeURIComponent(name)}`;
              return { signature: Buffer.from(res.data).toString("utf8").trim(), url };
            }
            const find = (re) => assets.map((a) => a.name).find((n) => re.test(n) && byName.has(`${n}.sig`));

            const platforms = {};
            const exe = find(/-setup\.exe$/);
            const msi = find(/\.msi$/);
            const mac = find(/\.app\.tar\.gz$/);
            if (exe) platforms["windows-x86_64"] = platforms["windows-x86_64-nsis"] = await entry(exe);
            if (msi) platforms["windows-x86_64-msi"] = await entry(msi);
            if (mac) {
              const m = await entry(mac); // universal bundle serves both architectures
              for (const k of ["darwin-aarch64", "darwin-x86_64", "darwin-aarch64-app", "darwin-x86_64-app"]) platforms[k] = m;
            }
            if (!exe || !mac) core.setFailed(`Missing signed bundles (exe: ${exe}, mac: ${mac})`);

            const latest = { version, notes: `StockApp v${version}`, pub_date: new Date().toISOString(), platforms };
            const old = byName.get("latest.json");
            if (old) await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: old.id });
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo,
              release_id,
              name: "latest.json",
              data: JSON.stringify(latest, null, 2),
              headers: { "content-type": "application/json" },
            });
            if (exe && mac) {
              await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false, make_latest: "true" });
            }
